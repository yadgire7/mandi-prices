# --------------------------------------------------------------------------
# Marathi text. DRAFT: every string below needs the admin's review before
# launch. A name with no Marathi entry is shown as AGMARKNET writes it.

names_mr:
  crops:   # keyed by crop key, for the post's headline sections
    cotton: "कापूस"
    soybean: "सोयाबीन"
    onion: "कांदा"
    wheat: "गहू"
    tur: "तूर"

# Varieties that say nothing ("Other" is on about 80% of rows). They are left
# out of the pages and the post, so the grade or a real variety tells rows apart.
hide_varieties: ["Other"]

# Devanagari names for every market are in names_markets_mr.yaml.
market_names_file: names_markets_mr.yaml

# Marathi names for every commodity and variety: the produce glossary.
produce_names_file: names_produce_mr.yaml

# How run times are named on the pages and in the post, followed by the time
# on a 12-hour clock: "सकाळ ६:००". A run gets the label of the last part that
# has started: 12 am to 12 pm सकाळ, 12 pm to 6 pm दुपार, 6 pm to 12 am संध्याकाळ.
day_parts_mr:
  - {from: 0, mr: "सकाळ"}
  - {from: 12, mr: "दुपार"}
  - {from: 18, mr: "संध्याकाळ"}

# Tooltips and the glossary at the foot of each page, from the AGMARKNET
# terminology glossary (agmarknet-glossary-mr.md).
glossary_mr:
  terms:
    "FAQ": {name: "वाजवी सरासरी प्रत (Fair Average Quality)", meaning: "ठरवलेल्या प्रमाणित दर्जाचा माल. हमीभाव याच प्रतीसाठी ठरतो."}
    "Non-FAQ": {name: "वाजवी सरासरीपेक्षा कमी प्रत (Below Fair Average Quality)", meaning: "वाजवी सरासरी दर्जापेक्षा कमी प्रतीचा माल; सहसा कमी भावात विकला जातो."}
    "Local": {name: "स्थानिक", meaning: "स्थानिक किंवा प्रतवारी न केलेला माल."}
  key:   # shown above the tables on every district page; no tap needed
    - "FAQ = वाजवी सरासरी प्रत"
    - "Non-FAQ = सरासरीपेक्षा कमी प्रत"
    - "प्रचलित भाव = ज्या भावाने सर्वाधिक माल विकला गेला"
  columns:
    col_date: "माल बाजारात आला आणि त्याचा भाव ठरला तो दिवस."
    col_min: "त्या दिवशीचा सर्वात कमी भाव."
    col_modal: "ज्या भावाने सर्वाधिक माल विकला गेला. हाच भाव तुलनेसाठी वापरा."
    col_max: "त्या दिवशीचा सर्वात जास्त भाव."
    col_variety: "वाण: शेतमालाचा प्रकार. प्रत: मालाचा दर्जा."

