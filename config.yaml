# Mandis and crops for the Shetkari Shala daily mandi price post.
#
# Names must match the data source exactly, or a filter silently misses.
# Every name below was confirmed by the Phase 0 probe on 25 Nov 2026 against
# data.gov.in's variety-wise resource (data/phase0/2026-11-25_1127/report.md).
# Matching ignores case and extra spaces: data.gov.in writes "APMC Lasalgaon "
# with a trailing space and "APMC  Latur" with two.
#
# No variety is pinned: posts and pages show every variety and grade the API
# returns. Each mandi's `crops` list is what the Phase 0 probe checks; the
# WhatsApp post uses `headline_crops` below.

state: Maharashtra

# How often the pipeline runs. GitHub reads its schedule only from the
# workflow file, so Phase 3 adds a test that fails if the cron line there
# does not match these values.
schedule:
  every_hours: 6          # 6 -> 06:00, 12:00, 18:00 and 00:00 IST
  first_run_ist: "06:00"  # this run always produces a post

# Crops shown in the WhatsApp post, at every tracked mandi that reports them,
# with every variety the API returns. The district pages show all crops.
headline_crops: [cotton, soybean, onion, wheat, tur]

crops:
  onion: ["Onion"]
  tomato: ["Tomato"]
  grapes: ["Grapes"]
  soybean: ["Soyabean"]
  cotton: ["Cotton"]
  tur: ["Red gram/Arhar/Tur(whole)"]
  chana: ["Bengal Gram(Gram)(Whole)"]
  wheat: ["Wheat"]
  pomegranate: ["Pomegranate"]
  jowar: ["Jowar(Sorghum)"]
  turmeric: ["Turmeric"]
  maize: ["Maize"]
  banana: ["Banana"]
  orange: ["Orange"]

# Pairs marked "gap" reported no price between 19 and 25 Nov 2026. They stay
# until you decide to drop them or move them to a market that reports them
# (options in docs/phase0-findings.md). Until then, the post lists them as
# not available.
mandis:
  - key: lasalgaon
    mr: "लासलगाव"   # short name for the post
    district: Nashik
    market: ["APMC Lasalgaon"]
    crops: [onion, tomato]  # gap: tomato
  - key: nashik
    mr: "नाशिक"   # short name for the post
    district: Nashik
    market: ["APMC Nasik"]
    crops: [grapes, onion]  # gap: grapes
  - key: pune
    mr: "पुणे"   # short name for the post
    district: Pune
    market: ["APMC Pune"]
    crops: [tomato, onion]  # both reported on only 2 of 7 days
  - key: akola
    mr: "अकोला"   # short name for the post
    district: Akola
    market: ["APMC Akola"]
    crops: [soybean, cotton, tur, chana, wheat]
  - key: latur
    mr: "लातूर"   # short name for the post
    district: Latur
    market: ["APMC Latur"]
    crops: [soybean, tur, chana]
  - key: yavatmal
    mr: "यवतमाळ"   # short name for the post
    district: Yavatmal
    market: ["APMC Yavatmal"]
    crops: [cotton, soybean]  # gap: cotton
  - key: solapur
    mr: "सोलापूर"   # short name for the post
    district: Solapur
    market: ["APMC Solapur"]
    crops: [pomegranate, jowar]
  - key: sangli
    mr: "सांगली"   # short name for the post
    district: Sangli
    market: ["APMC Sangli"]
    crops: [turmeric, jowar, maize]
  - key: jalgaon
    mr: "जळगाव"   # short name for the post
    district: Jalgaon
    market: ["APMC Jalgaon"]
    crops: [banana, cotton]  # gap: both
  - key: ahilyanagar
    mr: "अहिल्यानगर"   # short name for the post
    district: Ahilyanagar
    market: ["APMC Ahilyanagar"]
    crops: [onion, pomegranate, wheat]
  - key: nagpur
    mr: "नागपूर"   # short name for the post
    district: Nagpur
    market: ["APMC Nagpur"]
    crops: [soybean, tur, orange]
  - key: mumbai-vashi
    mr: "मुंबई (वाशी)"   # short name for the post
    district: Mumbai
    market: ["APMC Mumbai"]
    crops: []  # to choose: the probe lists what this market reports

# --------------------------------------------------------------------------
# Pipeline settings (Phase 1)

api:
  resource: "35985678-0d79-46b4-9ed6-6f13308a1d24"  # variety-wise daily prices
  state_filter: "filters[State]"           # confirmed by the Phase 0 probe
  date_filter: "filters[Arrival_Date]"     # confirmed by the Phase 0 probe
  date_format: "%d/%m/%Y"

fetch:
  days: 2        # days fetched, counting today: 2 = today (t) and yesterday (t-1)
  keep_days: 2   # days kept and shown, counting today: 2 = only t and t-1

# Weather alerts in the post, from the weather site (yadgire7/havaman), which
# publishes alerts.json every 4 hours. Only counts and our own district names
# reach the post. Old or unreadable alerts are left out, never fatal.
weather_alerts:
  url: "https://havaman.shetkarishala.com/alerts.json"   # empty switches it off
  page_url: "https://havaman.shetkarishala.com/"
  max_age_hours: 6       # older alerts are left out of the post
  max_districts: 8       # per line; the rest become "+ N जिल्हे"

# data.gov.in refuses GitHub's servers (outside India), so a machine in India
# fetches the prices and pushes them to the `data` branch; GitHub processes
# them. These limits decide when the run email complains that the data is old.
fetcher:
  warn_after_hours: 2    # older than this: WARN (the fetching machine missed a run)
  fail_after_hours: 12   # older than this: FAIL, nothing posted

checks:
  max_price: 1000000   # rupees per quintal; anything above is rejected
  jump_factor: 3       # a modal price this many times up or down is flagged
  max_text: 120        # longest market, crop, variety or grade name accepted

site:
  # The GitHub Pages address. Posts link here; empty leaves the link out.
  # GitHub Pages with a custom domain; it goes live in Phase 3.
  base_url: "https://bajarbhav.shetkarishala.com/"

# One page per district. `name` is AGMARKNET's spelling; `aliases` are other
# spellings the data has used for the same district. A district in the data
# that matches none of these lands on an "other" page and raises a WARN.
districts:
  - {name: Ahilyanagar, slug: ahilyanagar, mr: "अहिल्यानगर", aliases: [Ahmednagar]}
  - {name: Akola, slug: akola, mr: "अकोला"}
  - {name: Amarawati, slug: amravati, mr: "अमरावती", aliases: [Amravati]}
  - {name: Beed, slug: beed, mr: "बीड"}
  - {name: Bhandara, slug: bhandara, mr: "भंडारा"}
  - {name: Buldhana, slug: buldhana, mr: "बुलढाणा"}
  - {name: Chandrapur, slug: chandrapur, mr: "चंद्रपूर"}
  - {name: Chattrapati Sambhajinagar, slug: chhatrapati-sambhajinagar, mr: "छत्रपती संभाजीनगर", aliases: [Aurangabad]}
  - {name: Dharashiv, slug: dharashiv, mr: "धाराशिव", aliases: [Osmanabad, Murum]}
  - {name: Dhule, slug: dhule, mr: "धुळे"}
  - {name: Gadchiroli, slug: gadchiroli, mr: "गडचिरोली"}
  - {name: Gondiya, slug: gondiya, mr: "गोंदिया", aliases: [Gondia]}
  - {name: Hingoli, slug: hingoli, mr: "हिंगोली"}
  - {name: Jalgaon, slug: jalgaon, mr: "जळगाव"}
  - {name: Jalna, slug: jalna, mr: "जालना"}
  - {name: Kolhapur, slug: kolhapur, mr: "कोल्हापूर"}
  - {name: Latur, slug: latur, mr: "लातूर"}
  - {name: Mumbai, slug: mumbai, mr: "मुंबई", aliases: ["Bandra(E)"]}
  - {name: Nagpur, slug: nagpur, mr: "नागपूर"}
  - {name: Nanded, slug: nanded, mr: "नांदेड"}
  - {name: Nandurbar, slug: nandurbar, mr: "नंदुरबार"}
  - {name: Nashik, slug: nashik, mr: "नाशिक"}
  - {name: Palghar, slug: palghar, mr: "पालघर"}
  - {name: Parbhani, slug: parbhani, mr: "परभणी"}
  - {name: Pune, slug: pune, mr: "पुणे"}
  - {name: Raigad, slug: raigad, mr: "रायगड"}
  - {name: Ratnagiri, slug: ratnagiri, mr: "रत्नागिरी"}
  - {name: Sangli, slug: sangli, mr: "सांगली"}
  - {name: Satara, slug: satara, mr: "सातारा"}
  - {name: Sindhudurg, slug: sindhudurg, mr: "सिंधुदुर्ग"}
  - {name: Solapur, slug: solapur, mr: "सोलापूर"}
