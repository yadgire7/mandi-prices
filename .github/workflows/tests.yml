# Runs the tests on every pull request and on main. No secrets, read-only
# token, no network needed. (Never use pull_request_target here: it would run
# a stranger's code with this repository's permissions.)
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - run: python -m unittest discover -s tests
